# cargo-audit 配置（CI 在 src-tauri 目录下执行 `cargo audit`，会读取此文件）
#
# 原则：能升就升，升不了且有明确不可达理由的才写进 ignore，并且每条都要写清楚为什么。
# 这里只放**本程序不可利用**的上游公告；新增公告不在名单内，CI 仍会报警变红。

[advisories]
ignore = [
    # rsa: Marvin Attack —— 通过 PKCS#1 v1.5 私钥**解密**的计时侧信道恢复密钥。
    # 本程序是 SSH **客户端**，RSA 只用于"用私钥签名"（russh 的 rsa feature），
    # 从不把私钥用于对攻击者可控密文做解密，也没有暴露任何私钥解密接口，
    # 因此没有远程计时预言机可用。上游至今无修复版本（0.9/0.10-rc 均未修）。
    "RUSTSEC-2023-0071",

    # crypto-bigint 0.5.x: 常数时间运算的时间抖动。由 rsa 0.9 传递依赖引入，
    # 0.5 线已停止维护（修复只进了 0.7.6+）。0.7 线已通过 cargo update 升到 0.7.10，
    # 本条目仅覆盖遗留的 0.5.5；同样只出现在签名路径，不处理攻击者可控的私钥运算。
    "RUSTSEC-2026-0387",
]
