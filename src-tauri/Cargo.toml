[package]
name = "finalshell-x"
version = "0.4.0"
description = "FinalShell 复刻版 - SSH/SFTP/监控一体化服务器管理工具"
authors = ["you"]
edition = "2021"

[lib]
name = "finalshell_x_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
russh = { version = "0.62", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = { version = "2.4" }
futures = "0.3"
base64 = "0.22"
dirs = "6"
uuid = { version = "1", features = ["v4"] }
ssh-key = "0.6"
parking_lot = "0.12"
keyring = "4"
tokio-socks = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
ts-rs = { version = "12", features = ["serde-compat"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
strip = true
